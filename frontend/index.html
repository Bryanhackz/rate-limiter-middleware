<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rate Limiter Playground</title>
    <style>
        body { font-family: system-ui; background: #0f172a; color: #f8fafc; text-align: center; padding-top: 5rem; }
        button { padding: 1rem 2rem; font-size: 1.2rem; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #2563eb; }
        #output { margin-top: 2rem; padding: 2rem; background: #1e293b; border-radius: 8px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .ok { color: #10b981; }
        .blocked { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Rate Limiter Test</h1>
    <p>Click the button rapidly to trigger the 429 Too Many Requests.</p>
    <button id="btn-test">Send Request</button>
    <div id="output">Waiting for requests...</div>

    <script src="/main.js"></script>
</body>
</html>
